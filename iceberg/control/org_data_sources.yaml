namespace: control
table: org_data_sources
description: Org-level data source enables. Inherited by all workspaces unless overridden. Per D10, any catalog entry is enableable.
partition_by: [bucket(16, org_id)]
sort_by: [org_id, catalog_id]
schema:
  - { name: id, type: string, required: true, doc: "ULID; orgds_..." }
  - { name: org_id, type: string, required: true, doc: "FK control.orgs(id)" }
  - { name: catalog_id, type: string, required: true, doc: "FK control.data_source_catalog(id)" }
  - { name: instance_label, type: string, required: false }
  - { name: config_ref, type: string, required: true, doc: "OpenBao path: org/${org_id}/data_sources/${id}/" }
  - { name: enabled, type: boolean, required: true }
  - { name: enabled_by_user_id, type: string, required: true, doc: "FK control.users(id)" }
  - { name: enabled_at, type: timestamp, required: true }
  - { name: disabled_at, type: timestamp, required: false }
properties:
  format-version: "2"
  write.format.default: parquet
  write.parquet.compression-codec: zstd
cryptoshred:
  key_binding: org
  key_ref_column: null
indexes_duckdb:
  - { name: idx_id, columns: [id], type: btree }
  - { name: idx_org, columns: [org_id], type: btree }
foreign_keys:
  - { columns: [org_id], references: control.orgs(id) }
  - { columns: [catalog_id], references: control.data_source_catalog(id) }
  - { columns: [enabled_by_user_id], references: control.users(id) }
