namespace: obs
table: events
description: |
  Generic application events from all sitidos services (mcp, rpc, data, auth, esign, identity).
  Replaces OpenSearch in ADR-0005 stack delta. Backed by OTel-collector → parquet-writer pipeline.
  High-cardinality fields (trace_id, span_id) indexed for DuckDB cache lookups.
partition_by: [days(event_time), bucket(32, workspace_id)]
sort_by: [event_time]
schema:
  - { name: event_id, type: string, required: true, doc: "ULID; evt_..." }
  - { name: event_time, type: timestamp, required: true }
  - { name: workspace_id, type: string, required: false, doc: "Null for system-scope events (e.g. polaris ops)" }
  - { name: org_id, type: string, required: false }
  - { name: actor_user_id, type: string, required: false, doc: "Null for system actors" }
  - { name: actor_type, type: string, required: true, doc: "'user' | 'service' | 'mcp_client' | 'system' | 'webhook'" }
  - { name: service, type: string, required: true, doc: "Source service: 'mcp' | 'rpc' | 'data' | 'auth' | 'esign' | 'identity'" }
  - { name: event_type, type: string, required: true, doc: "Dotted name; e.g. 'esign.document.completed'" }
  - { name: severity, type: string, required: true, doc: "'debug' | 'info' | 'warn' | 'error' | 'critical'" }
  - { name: trace_id, type: string, required: false }
  - { name: span_id, type: string, required: false }
  - { name: attributes_json, type: string, required: false, doc: "OTel-compatible attributes (JSON-stringified)" }
  - { name: resource_attributes_json, type: string, required: false, doc: "OTel resource attrs (service.version, deployment.env, etc.)" }
properties:
  format-version: "2"
  write.format.default: parquet
  write.parquet.compression-codec: zstd
cryptoshred:
  key_binding: workspace
  key_ref_column: null
indexes_duckdb:
  - { name: idx_event_id, columns: [event_id], type: btree }
  - { name: idx_ws_time, columns: [workspace_id, event_time], type: btree }
  - { name: idx_trace, columns: [trace_id], type: btree }
  - { name: idx_type_time, columns: [event_type, event_time], type: btree }
foreign_keys:
  - { columns: [workspace_id], references: control.workspaces(id) }
  - { columns: [org_id], references: control.orgs(id) }
  - { columns: [actor_user_id], references: control.users(id) }
