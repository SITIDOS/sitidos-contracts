namespace: crm._template
table: contacts
description: |
  CRM contact (individual person). Template schema; see ./README.md.
  Canonical source: Dataverse `contacts` entity.
partition_by: [bucket(16, workspace_id)]
sort_by: [created_at]
schema:
  - { name: id, type: string, required: true }
  - { name: workspace_id, type: string, required: true }
  - { name: external_id, type: string, required: false }
  - { name: account_id, type: string, required: false, doc: "FK crm._template.accounts(id)" }
  - { name: first_name, type: string, required: false }
  - { name: last_name, type: string, required: false }
  - { name: full_name, type: string, required: false, doc: "Denormalized for sort/search" }
  - { name: email, type: string, required: false }
  - { name: phone, type: string, required: false }
  - { name: mobile_phone, type: string, required: false }
  - { name: job_title, type: string, required: false }
  - { name: department, type: string, required: false }
  - { name: mailing_address_json, type: string, required: false }
  - { name: owner_user_external_id, type: string, required: false }
  - { name: lead_source, type: string, required: false }
  - { name: status, type: string, required: false }
  - { name: source_system, type: string, required: true }
  - { name: created_at, type: timestamp, required: true }
  - { name: updated_at, type: timestamp, required: true }
  - { name: deleted_at, type: timestamp, required: false }
properties:
  format-version: "2"
  write.format.default: parquet
  write.parquet.compression-codec: zstd
cryptoshred:
  key_binding: workspace
  key_ref_column: null
indexes_duckdb:
  - { name: idx_id, columns: [id], type: btree }
  - { name: idx_ws_external, columns: [workspace_id, external_id], type: btree }
  - { name: idx_account, columns: [account_id], type: btree }
  - { name: idx_email, columns: [workspace_id, email], type: btree }
foreign_keys:
  - { columns: [workspace_id], references: control.workspaces(id) }
  - { columns: [account_id], references: crm._template.accounts(id) }
